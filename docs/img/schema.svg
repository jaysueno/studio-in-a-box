<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img">
<title>The schema: eight tables, a credits view and the booking function</title>
<desc>Nine boxes: members, bookings, classes, packages, credit_ledger, member_credits, payments, cash_close and staff, with the foreign keys between them and notes on book_class, expiry and the close.</desc>
<rect x="0" y="0" width="1200" height="520" fill="#001B3B"/><rect x="0.5" y="0.5" width="1199" height="519" fill="none" stroke="#EDE7DC" stroke-width="1"/><text x="60" y="52" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#F2EDE2">The tables, the ledger view, and the write paths for credits</text>
<text x="60" y="82" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA">Row level security is on for every table. Only the three functions write the ledger.</text>
<rect x="50" y="110" width="250" height="100" rx="6" fill="none" stroke="#EDE7DC" stroke-width="1"/><text x="66" y="140" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EDE2">members</text><text x="66" y="164" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">id, full_name, email</text>
<rect x="330" y="110" width="250" height="100" rx="6" fill="none" stroke="#EDE7DC" stroke-width="1"/><text x="346" y="140" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EDE2">bookings</text><text x="346" y="164" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">member_id, class_id, package_id</text><text x="346" y="183" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">cancelled_at (cancel_booking)</text>
<rect x="610" y="110" width="250" height="100" rx="6" fill="none" stroke="#EDE7DC" stroke-width="1"/><text x="626" y="140" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EDE2">classes</text><text x="626" y="164" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">instructor_id, starts_at, capacity</text>
<rect x="50" y="250" width="250" height="100" rx="6" fill="none" stroke="#EDE7DC" stroke-width="1"/><text x="66" y="280" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EDE2">packages</text><text x="66" y="304" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">member_id, credits, price</text>
<rect x="330" y="250" width="250" height="100" rx="6" fill="none" stroke="#8C5348" stroke-width="1"/><text x="346" y="280" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EDE2">credit_ledger</text><text x="346" y="304" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">kind, credits (signed), occurred_at</text>
<rect x="610" y="250" width="250" height="100" rx="6" fill="none" stroke="#59591D" stroke-width="1"/><text x="626" y="280" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EDE2">member_credits</text><text x="626" y="304" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">member_id, package_id, remaining</text>
<rect x="50" y="390" width="250" height="100" rx="6" fill="none" stroke="#EDE7DC" stroke-width="1"/><text x="66" y="420" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EDE2">payments</text><text x="66" y="444" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">amount, method, paid_at</text>
<rect x="330" y="390" width="250" height="100" rx="6" fill="none" stroke="#EDE7DC" stroke-width="1"/><text x="346" y="420" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EDE2">cash_close</text><text x="346" y="444" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">expected, counted, difference</text><text x="346" y="463" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">signed_off_by</text>
<rect x="610" y="390" width="250" height="100" rx="6" fill="none" stroke="#EDE7DC" stroke-width="1"/><text x="626" y="420" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EDE2">staff</text><text x="626" y="444" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">role: owner, front_desk, instructor</text>
<polygon points="149,210 149,236 151,236 151,210" fill="#8C5348"/><polygon points="150,246 145,236 155,236" fill="#8C5348"/>
<polygon points="449,210 449,236 451,236 451,210" fill="#8C5348"/><polygon points="450,246 445,236 455,236" fill="#8C5348"/>
<polygon points="304,151 316,151 316,149 304,149" fill="#8C5348"/><polygon points="326,150 316,155 316,145" fill="#8C5348"/>
<polygon points="606,149 594,149 594,151 606,151" fill="#8C5348"/><polygon points="584,150 594,145 594,155" fill="#8C5348"/>
<polygon points="304,291 316,291 316,289 304,289" fill="#8C5348"/><polygon points="326,290 316,295 316,285" fill="#8C5348"/>
<polygon points="584,291 596,291 596,289 584,289" fill="#59591D"/><polygon points="606,290 596,295 596,285" fill="#59591D"/>
<polygon points="304,431 316,431 316,429 304,429" fill="#8C5348"/><polygon points="326,430 316,435 316,425" fill="#8C5348"/>
<polygon points="584,431 596,431 596,429 584,429" fill="#8C5348"/><polygon points="606,430 596,435 596,425" fill="#8C5348"/>
<rect x="890" y="110" width="260" height="380" rx="6" fill="none" stroke="#EDE7DC" stroke-width="1"/>
<text x="906" y="140" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2EDE2">book_class(member, class)</text>
<text x="906" y="164" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">One transaction.</text>
<text x="906" y="186" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">Lock the member and the class.</text>
<text x="906" y="208" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">Refuse a full class or no credit.</text>
<text x="906" y="230" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">Take one credit, write the booking</text>
<text x="906" y="252" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">and the use row together.</text>
<text x="906" y="280" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">Expired packages cannot pay.</text>
<text x="906" y="302" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">Owner runs expire_credits.</text>
<text x="906" y="332" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8C5348">The ledger is append only.</text>
<text x="906" y="354" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">No UPDATE. No DELETE.</text>
<text x="906" y="376" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">No balance stored on a package.</text>
<text x="906" y="410" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F2EDE2">The close</text>
<text x="906" y="432" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">A difference needs a note and</text>
<text x="906" y="454" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">an owner sign-off. A closed day</text>
<text x="906" y="476" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#D8D3CA">is final for every role.</text></svg>
