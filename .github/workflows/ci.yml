name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests (offline)
        run: pnpm test

      - name: Production build (no environment needed)
        run: pnpm build

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start the local stack
        run: supabase start

      - name: Database tests
        run: supabase test db

      - name: Browser for the flows
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed the studio
        run: pnpm seed -- --seed 7

      - name: Browser flows
        run: pnpm e2e

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup
